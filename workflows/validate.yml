name: Verifier la base

on:
  push:
    paths: ["artists.json"]
  pull_request:
    paths: ["artists.json", "review/candidates.json"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controler la coherence de artists.json
        run: python3 scripts/validate.py
